# GTA6_AUTO_CLIPPER — configuración activa
# Zona horaria del operador: America/Lima (UTC-5)

operator_tz: America/Lima

discovery:
  lookback_hours: 24        # ventana de clips de Twitch (24hr | 7d según rango)
  twitch_range: 24hr        # 24hr | 7d | 30d | all
  not_before: "2026-11-18T11:00:00Z"   # desbloqueo NZ (06:00 Lima): nada anterior puede ser gameplay de GTA VI
  game_filter: [grand theft auto vi, gta vi, gta 6, gta6]   # categoría de Kick; se ignora en MODO TEST
  per_creator_max: 5        # objetivo: 4-5 clips por creador
  stale_hours: 6            # clips descubiertos sin procesar en este plazo se descartan
  min_views: 0              # sube esto cuando haya volumen (ej. 200)
  youtube_enabled: false   # YouTube bloquea descargas desde IPs de nube; activar solo en un PC propio
  youtube_tabs: [streams, videos, shorts]
  youtube_max_items: 6      # últimos N items por pestaña
  youtube_peaks_per_vod: 5  # picos de "más repetido" por VOD
  youtube_segment: [-18, 14]  # segundos alrededor del pico

twitch_api:                 # API oficial de Twitch (token inyectado por la sesión)
  client_id: 38r2gm3jnmp23utoi8g4ewh62mbc7j
  game_id: 1867279146         # Grand Theft Auto VI
  live_pages: 3               # hasta 300 streams en vivo revisados por ciclo
  live_min_viewers: 500
  live_top_per_lang: {en: 12, es: 10, pt: 6, de: 5, fr: 5, ru: 5, ja: 5, it: 3, other: 3}

focus:                      # bombardeo por regiones (hora de Lima). Prioriza idiomas en ranking en vivo y en revisión
  - name: asia
    from: "2026-11-18T06:00"
    to: "2026-11-18T17:59"
    langs: [ja, zh, ko, th, id, vi, tl, ms, hi]
    live_top_per_lang: {ja: 15, zh: 10, ko: 8, th: 6, id: 6, vi: 5, tl: 5, ms: 4, hi: 5, en: 6, other: 2}
  - name: europa+america
    from: "2026-11-18T18:00"
    to: "2026-11-18T21:59"
    langs: [es, en, pt, de, fr, ru, it, pl]
    live_top_per_lang: {es: 22, en: 12, pt: 6, de: 8, fr: 8, ru: 5, it: 4, pl: 4, other: 2}
  - name: america+europa
    from: "2026-11-18T22:00"
    to: "2026-11-18T23:59"
    langs: [es, en, pt, de, fr]
    live_top_per_lang: {es: 25, en: 15, pt: 8, de: 5, fr: 5, ru: 3, other: 2}
  - name: america
    from: "2026-11-19T00:00"
    to: "2026-11-19T12:00"
    langs: [en, es, pt]
    live_top_per_lang: {es: 25, en: 15, pt: 8, other: 2}
  # rotación diaria (solo HH:MM, hora de Lima). Las ventanas con fecha de arriba tienen prioridad.
  - name: america
    from: "00:00"
    to: "05:59"
    langs: [es, en, pt]
    live_top_per_lang: {es: 25, en: 15, pt: 8, other: 2}
  - name: asia
    from: "06:00"
    to: "17:59"
    langs: [ja, zh, ko, th, id, vi, tl, ms, hi]
    live_top_per_lang: {ja: 15, zh: 10, ko: 8, th: 6, id: 6, vi: 5, tl: 5, ms: 4, hi: 5, en: 6, other: 2}
  - name: europa+america
    from: "18:00"
    to: "21:59"
    langs: [es, en, pt, de, fr, ru, it, pl]
    live_top_per_lang: {es: 22, en: 12, pt: 6, de: 8, fr: 8, ru: 5, it: 4, pl: 4, other: 2}
  - name: america+europa
    from: "22:00"
    to: "23:59"
    langs: [es, en, pt, de, fr]
    live_top_per_lang: {es: 25, en: 15, pt: 8, de: 5, fr: 5, ru: 3, other: 2}

clip:
  min_seconds: 7
  max_seconds: 30
  max_seconds_howto: 55

transcribe:
  model: small              # tiny|base|small|medium (CPU). small = buen equilibrio
  compute_type: int8

render:
  width: 1080
  height: 1920
  fps_max: 60
  layout: blur              # blur | fill | stack
  zoom: 1.30                # zoom central del gameplay en layout blur
  video_top: 560            # y donde empieza el gameplay
  hook_seconds: 2.5         # gancho grande al inicio
  crf: 20
  preset: veryfast
  loudnorm: true
  font: Anton
  badge: GTA VI             # etiqueta de texto propia (no el logo oficial de Rockstar)
  watermark:                # marca de agua semitransparente, esquina inferior derecha del gameplay
    ES: "@gta6_es1"
    EN: "@gta6_en2"
  fontsdir: assets/fonts

publish:
  provider: upload_post     # upload_post | queue (queue = renderiza y deja listo, no publica)
  api_base: https://api.upload-post.com
  api_key_env: UPLOAD_POST_API_KEY   # si no existe, el proxy de la sesión inyecta la clave
  profiles:                 # nombre del "user/profile" en Upload-Post
    ES: GTA6_ES
    EN: default        # en Upload-Post las cuentas EN quedaron en el perfil 'default'
  platforms: [tiktok, instagram, youtube]
  daily_caps:               # topes duros de Upload-Post por cuenta / 24 h móviles
    tiktok: 15
    instagram: 48
    youtube: 10                # límite real de YouTube para canales nuevos (se reinicia a medianoche Pacífico)
  daily_reset_tz: {youtube: America/Los_Angeles}
  min_gap_minutes: 30       # 2 por hora por cuenta
  max_schedule_ahead_hours: {tiktok: 8, instagram: 12, youtube: 6}   # no programar más lejos (feed fresco)
  max_backlog_hours: 36     # redes conectadas tarde no reciben clips más viejos que esto
  tiktok_privacy: PUBLIC_TO_EVERYONE

spoiler:
  # El escudo anti-spoiler es para el OPERADOR, no para los clips: los clips pueden tener historia.
  # Aquí solo quedan filtros de seguridad de plataforma (por título).
  title_blocklist: [nude, naked, desnudo, desnuda, nsfw, strip club, stripclub, стрипуха, стрип]
  letterbox_reject: false
